<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/material-symbols-light--code-blocks.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.ico">    
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Frontend Developer | Manu Rejón</title>
  </head>
  <body class="bg-surface selection:bg-primary selection:text-on-primary overflow-x-hidden">
    <div id="app"></div>
    <!--
      Registro estático para Netlify Forms (el build detecta name + campos).
      El envío real lo hace ContactForm.vue (mismo name="contact" y mismos nombres de campo).
    -->
    <form name="contact" action="/" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
